<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBSE Class XII Chemistry Solved Paper - Interactive Guide</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- KaTeX for ultra-fast LaTeX Math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#F0F4F8',
                            100: '#D9E2EC',
                            200: '#BCCCDC',
                            300: '#9FB3C8',
                            500: '#1B365D',
                            600: '#15294A',
                            700: '#0F1E36',
                            800: '#0A1424',
                            900: '#050A12'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .math {
            font-family: 'Inter', sans-serif !important;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-navy-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 flex flex-col w-64 bg-white dark:bg-navy-800 border-r border-slate-200 dark:border-navy-700 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-0 transition-transform duration-300 ease-in-out">
            <!-- Sidebar Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 dark:border-navy-700">
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-navy-500 rounded-lg text-white">
                        <i class="fa-solid class fa-flask-vial text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-navy-500 dark:text-white leading-tight">GR School</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Class XII Chemistry</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden p-1 text-slate-400 hover:text-slate-600 dark:hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Sidebar Navigation Links -->
            <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex items-center w-full px-4 py-2.5 text-sm font-medium rounded-lg transition-colors text-navy-500 bg-navy-50 dark:bg-navy-700 dark:text-white">
                    <i class="fa-solid fa-chart-pie w-5 mr-3 text-lg"></i>
                    Dashboard / Overview
                </button>

                <div class="pt-4 pb-2 px-4">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">EXAM SECTIONS</span>
                </div>

                <button onclick="switchTab('section-a')" id="nav-section-a" class="flex items-center w-full px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-navy-700 transition-colors">
                    <i class="fa-solid fa-list-check w-5 mr-3 text-lg text-teal-500"></i>
                    Section A <span class="ml-auto text-xs px-2 py-0.5 bg-teal-100 text-teal-800 dark:bg-teal-900 dark:text-teal-200 rounded-full font-bold">16M</span>
                </button>

                <button onclick="switchTab('section-b')" id="nav-section-b" class="flex items-center w-full px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-navy-700 transition-colors">
                    <i class="fa-solid fa-circle-info w-5 mr-3 text-lg text-indigo-500"></i>
                    Section B <span class="ml-auto text-xs px-2 py-0.5 bg-indigo-100 text-indigo-800 dark:bg-indigo-900 dark:text-indigo-200 rounded-full font-bold">10M</span>
                </button>

                <button onclick="switchTab('section-c')" id="nav-section-c" class="flex items-center w-full px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-navy-700 transition-colors">
                    <i class="fa-solid fa-clipboard-question w-5 mr-3 text-lg text-purple-500"></i>
                    Section C <span class="ml-auto text-xs px-2 py-0.5 bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200 rounded-full font-bold">21M</span>
                </button>

                <button onclick="switchTab('section-d')" id="nav-section-d" class="flex items-center w-full px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-navy-700 transition-colors">
                    <i class="fa-solid fa-book-open-reader w-5 mr-3 text-lg text-pink-500"></i>
                    Section D <span class="ml-auto text-xs px-2 py-0.5 bg-pink-100 text-pink-800 dark:bg-pink-900 dark:text-pink-200 rounded-full font-bold">8M</span>
                </button>

                <button onclick="switchTab('section-e')" id="nav-section-e" class="flex items-center w-full px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-navy-700 transition-colors">
                    <i class="fa-solid fa-file-invoice w-5 mr-3 text-lg text-amber-500"></i>
                    Section E <span class="ml-auto text-xs px-2 py-0.5 bg-amber-100 text-amber-800 dark:bg-amber-900 dark:text-amber-200 rounded-full font-bold">25M</span>
                </button>

                <div class="pt-4 pb-2 px-4">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500">INTERACTIVE TOOLS</span>
                </div>

                <button onclick="switchTab('calculators')" id="nav-calculators" class="flex items-center w-full px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-navy-700 transition-colors">
                    <i class="fa-solid fa-calculator w-5 mr-3 text-lg text-emerald-500"></i>
                    Chemistry Solvers
                </button>

                <button onclick="switchTab('quiz')" id="nav-quiz" class="flex items-center w-full px-4 py-2.5 text-sm font-medium rounded-lg text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-navy-700 transition-colors">
                    <i class="fa-solid fa-gamepad w-5 mr-3 text-lg text-red-500"></i>
                    Interactive MCQ Quiz
                </button>
            </nav>

            <!-- Sidebar Footer -->
            <div class="p-4 border-t border-slate-100 dark:border-navy-700 bg-slate-50 dark:bg-navy-800/50">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-regular fa-folder-open text-slate-400"></i>
                        <span class="text-xs font-medium text-slate-500 dark:text-slate-400">Word Document Available</span>
                    </div>
                    <a href="CBSE_Class_12_Chemistry_Solved_Paper.docx" download class="p-1.5 bg-navy-500 text-white hover:bg-navy-600 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-md text-xs font-bold transition-all shadow-sm">
                        <i class="fa-solid fa-download"></i> DOCX
                    </a>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 flex flex-col h-full overflow-hidden">
            <!-- TOP BAR -->
            <header class="flex items-center justify-between px-6 py-4 bg-white dark:bg-navy-800 border-b border-slate-200 dark:border-navy-700">
                <!-- Hamburger on Mobile -->
                <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 text-slate-500 hover:text-slate-800 dark:text-slate-300 dark:hover:text-white rounded-lg">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>

                <!-- Search Input -->
                <div class="relative w-64 max-w-xs md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-sm"></i>
                    <input type="text" id="search-bar" onkeyup="handleSearch()" placeholder="Search questions..." class="w-full pl-10 pr-4 py-2 border border-slate-200 dark:border-navy-700 rounded-lg bg-slate-50 dark:bg-navy-900/50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-navy-500 dark:focus:ring-slate-600 text-sm transition-all">
                </div>

                <!-- Right Tools (Dark Mode, Reset, Profile) -->
                <div class="flex items-center space-x-3">
                    <button onclick="toggleDarkMode()" class="p-2.5 rounded-lg border border-slate-200 dark:border-navy-700 hover:bg-slate-100 dark:hover:bg-navy-700 text-slate-500 dark:text-slate-300 transition-colors">
                        <i id="theme-icon" class="fa-regular fa-moon text-lg"></i>
                    </button>
                    <div class="h-8 w-px bg-slate-200 dark:bg-navy-700 hidden sm:block"></div>
                    <div class="hidden sm:flex items-center space-x-2">
                        <div class="h-8 w-8 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-sm">
                            CH
                        </div>
                        <span class="text-xs font-semibold text-slate-600 dark:text-slate-300">Chemistry Hub</span>
                    </div>
                </div>
            </header>

            <!-- DASHBOARD CONTAINER -->
            <div id="content-area" class="flex-1 overflow-y-auto p-6 lg:p-8 space-y-8">
                <!-- Content gets injected dynamically or switched by tabs -->
            </div>
        </main>
    </div>

    <!-- MAIN JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
