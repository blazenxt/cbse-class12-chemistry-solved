<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBSE Class XII Chemistry Solved Paper - Advanced Interactive Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- KaTeX for math formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#EEF2F6',
                            100: '#D2DCE6',
                            500: '#1E3A8A',
                            600: '#172554',
                            900: '#0F172A'
                        },
                        navy: {
                            50: '#F0F4F8',
                            100: '#D9E2EC',
                            500: '#1B365D',
                            600: '#15294A',
                            700: '#0F1E36',
                            800: '#0A1424',
                            900: '#020617'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200">

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 flex flex-col w-64 bg-white dark:bg-slate-900 border-r border-slate-200/80 dark:border-slate-800 transform -translate-x-full lg:translate-x-0 lg:static lg:inset-0 transition-transform duration-300 ease-in-out shadow-sm lg:shadow-none">
            <!-- Sidebar Header -->
            <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100 dark:border-slate-800">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl text-white shadow-md shadow-blue-500/20">
                        <i class="fa-solid fa-flask-vial text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-blue-900 dark:text-white leading-tight">GR Chemistry</h1>
                        <p class="text-[10px] font-semibold tracking-wider text-blue-600 dark:text-blue-400 uppercase">Board Portal</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="lg:hidden p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-white rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Sidebar Navigation Links -->
            <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex items-center w-full px-4 py-3 text-sm font-semibold rounded-xl transition-all text-blue-600 bg-blue-50 dark:bg-blue-950/40 dark:text-blue-200">
                    <i class="fa-solid fa-grid-2-alt w-5 mr-3 text-lg"></i>
                    Dashboard & Progress
                </button>

                <div class="pt-5 pb-2 px-4">
                    <span class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 dark:text-slate-500">Exam Papers</span>
                </div>

                <button onclick="switchTab('section-a')" id="nav-section-a" class="flex items-center w-full px-4 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-white transition-all">
                    <i class="fa-solid fa-list-check w-5 mr-3 text-lg text-emerald-500"></i>
                    Section A <span class="ml-auto text-[10px] px-2 py-0.5 bg-emerald-100 text-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-300 rounded-full font-bold">16M</span>
                </button>

                <button onclick="switchTab('section-b')" id="nav-section-b" class="flex items-center w-full px-4 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-white transition-all">
                    <i class="fa-solid fa-circle-info w-5 mr-3 text-lg text-indigo-500"></i>
                    Section B <span class="ml-auto text-[10px] px-2 py-0.5 bg-indigo-100 text-indigo-800 dark:bg-indigo-950/40 dark:text-indigo-300 rounded-full font-bold">10M</span>
                </button>

                <button onclick="switchTab('section-c')" id="nav-section-c" class="flex items-center w-full px-4 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-white transition-all">
                    <i class="fa-solid fa-clipboard-question w-5 mr-3 text-lg text-purple-500"></i>
                    Section C <span class="ml-auto text-[10px] px-2 py-0.5 bg-purple-100 text-purple-800 dark:bg-purple-950/40 dark:text-purple-300 rounded-full font-bold">21M</span>
                </button>

                <button onclick="switchTab('section-d')" id="nav-section-d" class="flex items-center w-full px-4 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-white transition-all">
                    <i class="fa-solid fa-book-open-reader w-5 mr-3 text-lg text-pink-500"></i>
                    Section D <span class="ml-auto text-[10px] px-2 py-0.5 bg-pink-100 text-pink-800 dark:bg-pink-950/40 dark:text-pink-300 rounded-full font-bold">8M</span>
                </button>

                <button onclick="switchTab('section-e')" id="nav-section-e" class="flex items-center w-full px-4 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-white transition-all">
                    <i class="fa-solid fa-file-invoice w-5 mr-3 text-lg text-amber-500"></i>
                    Section E <span class="ml-auto text-[10px] px-2 py-0.5 bg-amber-100 text-amber-800 dark:bg-amber-950/40 dark:text-amber-300 rounded-full font-bold">25M</span>
                </button>

                <div class="pt-5 pb-2 px-4">
                    <span class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 dark:text-slate-500">Add-ons & Utilities</span>
                </div>

                <button onclick="switchTab('periodic-table')" id="nav-periodic-table" class="flex items-center w-full px-4 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-white transition-all">
                    <i class="fa-solid fa-table w-5 mr-3 text-lg text-cyan-500"></i>
                    Syllabus Periodic Table
                </button>

                <button onclick="switchTab('calculators')" id="nav-calculators" class="flex items-center w-full px-4 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-white transition-all">
                    <i class="fa-solid fa-calculator w-5 mr-3 text-lg text-emerald-500"></i>
                    Chemistry Solvers
                </button>

                <button onclick="switchTab('quiz')" id="nav-quiz" class="flex items-center w-full px-4 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-white transition-all">
                    <i class="fa-solid fa-graduation-cap w-5 mr-3 text-lg text-red-500"></i>
                    Interactive MCQ Quiz
                </button>

                <button onclick="switchTab('bookmarks')" id="nav-bookmarks" class="flex items-center w-full px-4 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:bg-slate-50 dark:text-slate-400 dark:hover:bg-slate-800/50 hover:text-slate-900 dark:hover:text-white transition-all">
                    <i class="fa-solid fa-star w-5 mr-3 text-lg text-yellow-500"></i>
                    Bookmarked Questions
                </button>
            </nav>

            <!-- Sidebar Footer -->
            <div class="p-4 border-t border-slate-100 dark:border-slate-850 bg-slate-50 dark:bg-slate-900/50">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-regular fa-file-word text-blue-500"></i>
                        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Offline Guide</span>
                    </div>
                    <a href="CBSE_Class_12_Chemistry_Solved_Paper.docx" download class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition-all shadow-sm">
                        <i class="fa-solid fa-download"></i> DOCX
                    </a>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 flex flex-col h-full overflow-hidden">
            <!-- TOP BAR -->
            <header class="flex items-center justify-between px-6 py-4 bg-white dark:bg-slate-900 border-b border-slate-200/80 dark:border-slate-800/80 z-20">
                <!-- Hamburger on Mobile -->
                <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>

                <!-- Search Input with advanced filtering info -->
                <div class="relative w-64 max-w-xs md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-sm"></i>
                    <input type="text" id="search-bar" onkeyup="handleSearch()" placeholder="Search (e.g., kinetics, Nernst, Sn2)..." class="w-full pl-10 pr-4 py-2 border border-slate-200 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 text-sm transition-all">
                </div>

                <!-- Right Side Actions -->
                <div class="flex items-center space-x-3.5">
                    <!-- Bookmarked counter -->
                    <button onclick="switchTab('bookmarks')" class="p-2 relative rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-colors">
                        <i class="fa-solid fa-star text-base text-yellow-500"></i>
                        <span id="bookmark-badge" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[9px] font-black h-5 w-5 rounded-full flex items-center justify-center border border-white dark:border-slate-900 shadow-sm">0</span>
                    </button>

                    <!-- Dark Mode Toggle -->
                    <button onclick="toggleDarkMode()" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-colors">
                        <i id="theme-icon" class="fa-regular fa-moon text-lg"></i>
                    </button>
                    
                    <div class="h-6 w-px bg-slate-200 dark:bg-slate-800 hidden sm:block"></div>
                    
                    <div class="hidden sm:flex items-center space-x-2">
                        <div class="h-8 w-8 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white flex items-center justify-center font-bold text-xs shadow-md shadow-blue-500/10">
                            CHEM
                        </div>
                        <div class="text-left">
                            <span class="text-xs font-bold text-slate-700 dark:text-slate-200 block">Class XII Portal</span>
                            <span class="text-[9px] text-slate-400 dark:text-slate-500 block font-semibold leading-tight">Board Solved Database</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- INTERACTIVE CONTAINER -->
            <div id="content-area" class="flex-1 overflow-y-auto p-6 lg:p-8 space-y-8">
                <!-- Main templates inject dynamically via script.js -->
            </div>
        </main>
    </div>

    <!-- MAIN JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
